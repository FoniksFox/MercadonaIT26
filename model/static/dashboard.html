<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test heatmap</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --border: #27272a;
            --text: #e4e4e7;
            --muted: #a1a1aa;
            --accent: #0ea5e9;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-content {
            flex: 1;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }

        #status-indicator {
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--muted);
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
        }
        .dot.active { background: var(--success); }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1.5rem;
        }

        .feed-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .feed-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.02);
        }

        .stream-container {
            aspect-ratio: 4/3;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stream-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .sidebar {
            width: 320px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .stat-card {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 6px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 1.25rem;
            color: var(--accent);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--text);
            border-radius: 50%;
            cursor: pointer;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.875rem;
            cursor: pointer;
            user-select: none;
        }
        .toggle-row input {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            margin: 0;
            cursor: pointer;
        }

        .btn-clear {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--danger);
            padding: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .btn-clear:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
        }

        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 0;
        }
    </style>
</head>
<body>
    <main class="main-content">
        <header class="header">
            <h1>Visualizador</h1>
            <div id="status-indicator">
                <span class="dot" id="ws-dot"></span>
                <span id="ws-text">Desconectado</span>
            </div>
        </header>

        <div class="video-grid">
            <div class="feed-card" id="card-raw">
                <div class="feed-header">Cámara en vivo</div>
                <div class="stream-container">
                    <img id="stream-raw" src="" alt="Esperando señal...">
                </div>
            </div>
            <div class="feed-card" id="card-heat">
                <div class="feed-header">Mapa de calor</div>
                <div class="stream-container">
                    <img id="stream-heat" src="" alt="Esperando señal...">
                </div>
            </div>
            <div class="feed-card" id="card-flow">
                <div class="feed-header">Mapa de flujos (vectores)</div>
                <div class="stream-container">
                    <img id="stream-flow" src="" alt="Esperando señal...">
                </div>
            </div>
            <div class="feed-card" id="card-pheat">
                <div class="feed-header">Mapa de calor persistente</div>
                <div class="stream-container">
                    <img id="stream-pheat" src="" alt="Esperando señal...">
                </div>
            </div>
        </div>
    </main>

    <aside class="sidebar">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Personas</div>
                <div class="stat-value" id="val-count">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">FPS IA</div>
                <div class="stat-value" id="val-fps">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Latencia</div>
                <div class="stat-value"><span id="val-lat">0</span>ms</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Hardware</div>
                <div class="stat-value" id="val-dev" style="color: #a855f7">-</div>
            </div>
            <div class="stat-card" style="grid-column: span 2;">
                <div class="stat-label">Zonas de mayor afluencia</div>
                <div id="val-hotspots" style="font-size: 0.8rem; color: #38bdf8; margin-top: 4px; line-height: 1.4;">Esperando flujo...</div>
            </div>
        </div>

        <hr>

        <div class="control-group">
            <label class="toggle-row">
                <input type="checkbox" id="ctrl-camera" checked>
                Mostrar cámara
            </label>
            <label class="toggle-row">
                <input type="checkbox" id="ctrl-heatmap" checked>
                Mostrar mapa de calor
            </label>
            <label class="toggle-row">
                <input type="checkbox" id="ctrl-pheat" checked>
                Mostrar calor persistente
            </label>
            <label class="toggle-row">
                <input type="checkbox" id="ctrl-flow" checked>
                Mostrar mapa de flujos
            </label>
            <label class="toggle-row">
                <input type="checkbox" id="ctrl-processing" checked>
                Motor de IA
            </label>
            <label class="toggle-row">
                <input type="checkbox" id="ctrl-boxes" checked>
                Cajas de detección
            </label>
            <label class="toggle-row" style="color: #38bdf8;">
                <input type="checkbox" id="ctrl-stability" checked>
                Estabilización (Centroide + EMA)
            </label>
        </div>

        <hr>

        <div class="control-group">
            <div class="control-item">
                <div class="control-header">
                    <span>Decaimiento</span>
                    <span id="lbl-decay">0.85</span>
                </div>
                <input type="range" id="ctrl-decay" min="0" max="0.99" step="0.01" value="0.85">
            </div>
            
            <div class="control-item">
                <div class="control-header">
                    <span>Radio</span>
                    <span id="lbl-radius">31</span>
                </div>
                <input type="range" id="ctrl-radius" min="11" max="101" step="2" value="31">
            </div>

            <div class="control-item">
                <div class="control-header">
                    <span>Confianza</span>
                    <span id="lbl-conf">0.40</span>
                </div>
                <input type="range" id="ctrl-conf" min="0.1" max="0.9" step="0.05" value="0.40">
            </div>
        </div>

        <button class="btn-clear" onclick="clearHeatmap()">Limpiar datos</button>
    </aside>

    <script>
        const imgRaw = document.getElementById('stream-raw');
        const imgHeat = document.getElementById('stream-heat');
        const imgFlow = document.getElementById('stream-flow');
        const imgPHeat = document.getElementById('stream-pheat');
        const cardRaw = document.getElementById('card-raw');
        const cardHeat = document.getElementById('card-heat');
        const cardFlow = document.getElementById('card-flow');
        const cardPHeat = document.getElementById('card-pheat');
        const wsDot = document.getElementById('ws-dot');
        const wsText = document.getElementById('ws-text');
        
        let wsHeatmap = null;
        let wsDemo = null;

        function connect() {
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            
            wsHeatmap = new WebSocket(`${protocol}//${window.location.host}/ws/v1/heatmap/data`);
            wsDemo = new WebSocket(`${protocol}//${window.location.host}/ws/v1/video/demo`);
            
            wsHeatmap.onopen = () => {
                wsDot.classList.add('active');
                wsText.textContent = 'En línea';
            };
            
            wsHeatmap.onclose = () => {
                wsDot.classList.remove('active');
                wsText.textContent = 'Desconectado';
                setTimeout(connect, 1000);
            };
            
            wsHeatmap.onmessage = (e) => {
                const data = JSON.parse(e.data);
                document.getElementById('val-count').textContent = data.stats.count;
                document.getElementById('val-fps').textContent = data.stats.fps;
                document.getElementById('val-lat').textContent = data.stats.latency;
                document.getElementById('val-dev').textContent = data.stats.device.toUpperCase();

                if (data.stats.hotspots && data.stats.hotspots.length > 0) {
                    const listHtml = data.stats.hotspots.map(h => 
                        `<div><strong>#${h.rank}</strong> Coord: (${h.x}, ${h.y}) &bull; Tráfico: <em>${h.traffic}</em></div>`
                    ).join('');
                    document.getElementById('val-hotspots').innerHTML = listHtml;
                }
            };

            wsDemo.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.image_raw) imgRaw.src = 'data:image/jpeg;base64,' + data.image_raw;
                if (data.image_heat) imgHeat.src = 'data:image/jpeg;base64,' + data.image_heat;
                if (data.image_flow) imgFlow.src = 'data:image/jpeg;base64,' + data.image_flow;
                if (data.image_persistent_heat) imgPHeat.src = 'data:image/jpeg;base64,' + data.image_persistent_heat;
            };
        }

        async function updateConfig() {
            cardRaw.style.display = document.getElementById('ctrl-camera').checked ? 'flex' : 'none';
            cardHeat.style.display = document.getElementById('ctrl-heatmap').checked ? 'flex' : 'none';
            cardFlow.style.display = document.getElementById('ctrl-flow').checked ? 'flex' : 'none';
            cardPHeat.style.display = document.getElementById('ctrl-pheat').checked ? 'flex' : 'none';

            await fetch('/api/v1/config', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    processing_enabled: document.getElementById('ctrl-processing').checked,
                    show_heatmap: document.getElementById('ctrl-heatmap').checked,
                    show_pheat: document.getElementById('ctrl-pheat').checked,
                    show_flow: document.getElementById('ctrl-flow').checked,
                    show_boxes: document.getElementById('ctrl-boxes').checked,
                    stability_mode: document.getElementById('ctrl-stability').checked,
                    decay: parseFloat(document.getElementById('ctrl-decay').value),
                    radius: parseInt(document.getElementById('ctrl-radius').value),
                    confidence: parseFloat(document.getElementById('ctrl-conf').value)
                })
            });
        }


        async function clearHeatmap() {
            await fetch('/api/v1/heatmap/clear', { method: 'POST' });
        }

        document.querySelectorAll('input').forEach(el => {
            el.addEventListener('input', (e) => {
                if (e.target.type === 'range') {
                    document.getElementById(`lbl-${e.target.id.split('-')[1]}`).textContent = e.target.value;
                }
                updateConfig();
            });
        });

        connect();
    </script>
</body>
</html>
