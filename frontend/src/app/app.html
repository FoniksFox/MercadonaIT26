<div class="flex min-h-screen flex-col bg-canvas font-sans text-ink md:flex-row">
  <aside
    class="flex shrink-0 flex-col gap-4 bg-sidebar px-4 py-4 text-white shadow-xl md:sticky md:top-0 md:h-screen md:w-72 md:gap-6 md:py-6"
  >
    <div class="flex items-center gap-2 rounded-2xl bg-sidebar-panel p-4 shadow-inner md:p-5">
      <a routerLink="/maps" class="flex min-w-0 flex-1 items-center gap-4">
        <img src="favicon.svg" alt="" width="48" height="48" class="size-12 shrink-0 rounded-xl" />
        <span class="truncate text-2xl font-extrabold tracking-tight">MercaTrack</span>
      </a>
      <button
        type="button"
        class="rounded-xl p-2.5 transition-colors hover:bg-white/15 md:hidden"
        [attr.aria-label]="theme.mode() === 'dark' ? 'Modo claro' : 'Modo oscuro'"
        (click)="theme.toggle()"
      >
        <app-icon [name]="theme.mode() === 'dark' ? 'sun' : 'moon'" class="size-6" />
      </button>
    </div>

    <nav
      #nav
      class="relative flex min-h-0 gap-2 overflow-x-auto rounded-2xl bg-sidebar-panel/90 p-3 shadow-inner md:flex-1 md:flex-col md:overflow-x-visible md:overflow-y-auto"
      [class.indicator-fade]="indicatorFade()"
      aria-label="Navegación principal"
    >
      @if (indicator(); as box) {
        <div
          class="tab-active-indicator"
          aria-hidden="true"
          [style.top.px]="box.top"
          [style.left.px]="box.left"
          [style.width.px]="box.width"
          [style.height.px]="box.height"
          [style.opacity]="indicatorFade() ? 0 : 1"
        ></div>
      }

      <div class="flex gap-2 md:flex-col md:gap-3">
        @for (item of mainNavigation; track item.path) {
          <a
            [routerLink]="item.path"
            [attr.aria-current]="activePath() === item.path ? 'page' : null"
            class="relative z-10 flex min-h-14 shrink-0 items-center gap-4 rounded-xl px-4 text-lg font-semibold text-white transition-colors hover:bg-white/15"
          >
            <app-icon [name]="item.icon" class="size-7" />
            {{ item.label }}
          </a>
        }
      </div>

      <div class="flex gap-2 md:mt-auto md:flex-col md:gap-3 md:border-t md:border-white/25 md:pt-3">
        <a
          [routerLink]="settings.path"
          [attr.aria-current]="activePath() === settings.path ? 'page' : null"
          class="relative z-10 flex min-h-14 shrink-0 items-center gap-4 rounded-xl px-4 text-lg font-semibold text-white transition-colors hover:bg-white/15"
        >
          <app-icon [name]="settings.icon" class="size-7" />
          {{ settings.label }}
        </a>
        <a
          [routerLink]="storesPath"
          [attr.aria-current]="activePath() === storesPath ? 'page' : null"
          class="relative z-10 flex min-h-14 shrink-0 items-center gap-4 rounded-xl px-4 py-2 text-white transition-colors hover:bg-white/15"
        >
          <app-icon name="store" class="size-7" />
          <span class="min-w-0">
            <span class="block truncate text-lg leading-6 font-semibold">{{ sidebarStoreName() }}</span>
            <span class="block text-xs text-white/80">Cambiar de Mercadona</span>
          </span>
        </a>
      </div>
    </nav>

    <button
      type="button"
      class="hidden items-center gap-4 rounded-xl px-4 py-2.5 font-medium text-white/90 transition-colors hover:bg-white/15 md:flex"
      (click)="theme.toggle()"
    >
      <app-icon [name]="theme.mode() === 'dark' ? 'sun' : 'moon'" class="size-6" />
      {{ theme.mode() === 'dark' ? 'Modo claro' : 'Modo oscuro' }}
    </button>
  </aside>

  <main class="min-w-0 flex-1 overflow-hidden">
    <div
      [class.content-slide-down]="isPageAnimating() && navigationDirection() === 'down'"
      [class.content-slide-up]="isPageAnimating() && navigationDirection() === 'up'"
    >
      <router-outlet />
    </div>
  </main>
</div>
