<main class="min-h-screen bg-slate-950 text-slate-100">
  <div class="mx-auto flex max-w-4xl flex-col items-center px-6 py-16 text-center">
    <h1 class="text-5xl font-bold tracking-tight">{{ title() }}</h1>
    <p class="mt-4 text-lg text-slate-400">La tienda que entiende su propio movimiento</p>

    <div class="mt-12 grid w-full gap-6 sm:grid-cols-2">
      <section class="rounded-2xl border border-slate-800 bg-slate-900 p-6">
        <h2 class="text-xl font-semibold">Heatmap</h2>
        <p class="mt-2 text-sm text-slate-400">
          Where people move and stand over time.
        </p>
      </section>
      <section class="rounded-2xl border border-slate-800 bg-slate-900 p-6">
        <h2 class="text-xl font-semibold">Vector field</h2>
        <p class="mt-2 text-sm text-slate-400">
          Direction and magnitude of movement.
        </p>
      </section>
    </div>

    <button
      type="button"
      class="mt-12 rounded-xl bg-emerald-500 px-8 py-3 font-semibold text-slate-950 transition hover:bg-emerald-400"
    >
      Upload a video
    </button>
  </div>
</main>
