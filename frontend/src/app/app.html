<div class="flex min-h-screen flex-col bg-canvas text-ink md:flex-row">
  <aside
    class="flex shrink-0 flex-col bg-sidebar text-white md:sticky md:top-0 md:h-screen md:w-64"
  >
    <a routerLink="/maps" class="block px-6 pt-5 md:pt-7">
      <span class="flex items-center gap-3">
        <img src="favicon.svg" alt="" width="36" height="36" class="size-9 rounded-lg" />
        <span class="text-2xl font-bold tracking-tight">MercaTrack</span>
      </span>
      <span class="mt-2 hidden text-sm text-white/75 md:block">
        La tienda que entiende su propio movimiento
      </span>
    </a>

    <nav
      aria-label="Navegación principal"
      class="mt-4 flex gap-1 overflow-x-auto px-3 pb-3 md:mt-8 md:flex-col md:pb-0"
    >
      @for (item of navigation; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-white/15"
          ariaCurrentWhenActive="page"
          class="flex shrink-0 items-center gap-3 rounded-lg px-3 py-2.5 font-medium text-white/90 transition-colors hover:bg-white/10"
        >
          <app-icon [name]="item.icon" class="size-5" />
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="flex gap-2 px-3 pb-3 md:mt-auto md:flex-col md:pb-5">
      <a
        routerLink="/stores"
        routerLinkActive="bg-white/15"
        ariaCurrentWhenActive="page"
        class="flex min-w-0 flex-1 items-center gap-3 rounded-lg border border-white/25 px-3 py-2.5 transition-colors hover:bg-white/10"
      >
        <app-icon name="store" class="size-5" />
        <span class="min-w-0 flex-1">
          <span class="block truncate font-semibold">{{ supermarket().name }}</span>
          <span class="block text-xs text-white/75">Cambiar de Mercadona</span>
        </span>
        <app-icon name="swap" class="size-4 text-white/75" />
      </a>

      <button
        type="button"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-white/90 transition-colors hover:bg-white/10"
        (click)="theme.toggle()"
      >
        <app-icon [name]="theme.mode() === 'dark' ? 'sun' : 'moon'" class="size-5" />
        <span class="hidden md:inline">
          {{ theme.mode() === 'dark' ? 'Modo claro' : 'Modo oscuro' }}
        </span>
        <span class="sr-only md:hidden">
          {{ theme.mode() === 'dark' ? 'Modo claro' : 'Modo oscuro' }}
        </span>
      </button>
    </div>
  </aside>

  <main class="min-w-0 flex-1">
    <router-outlet />
  </main>
</div>
