<div class="mx-auto max-w-7xl px-6 py-6 md:px-8 md:py-8">
<app-page-header title="Estadísticas" />

<nav
  class="page-content mt-6 flex gap-6 border-b border-line text-sm font-semibold"
  aria-label="Periodo de estadísticas"
  role="tablist"
>
  @for (option of ranges; track option.id) {
    <button
      type="button"
      role="tab"
      class="-mb-px border-b-2 pb-3"
      [class]="range() === option.id ? 'border-accent text-ink' : 'border-transparent text-ink-2 hover:text-ink'"
      [attr.aria-selected]="range() === option.id"
      (click)="range.set(option.id)"
    >
      {{ option.label }}
    </button>
  }
</nav>

<div class="page-content mt-6 space-y-6">
  <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
    <app-stat-tile
      label="Visitantes"
      icon="cart"
      [value]="visitors()"
      [change]="data().visitorsChange"
      [against]="against()"
    />
    <app-stat-tile
      label="Permanencia media"
      icon="timer"
      [value]="data().stayMinutes + ' min'"
      [change]="data().stayChange"
      [against]="against()"
    />
    <app-stat-tile label="Hora punta" icon="clock" [value]="data().peakHour" />
    <app-stat-tile
      label="Zona más visitada"
      [icon]="data().mostVisited.icon"
      [value]="data().mostVisited.name"
    />
  </div>

  <app-chart-card title="Afluencia por hora" [unit]="hourlyUnit()">
    <app-line-chart [labels]="hours" [series]="hourlySeries()" label="Afluencia por hora" />
    <app-data-table chartTable [columns]="hourlyTable().columns" [rows]="hourlyTable().rows" />
  </app-chart-card>

  <div class="grid gap-6 xl:grid-cols-2">
    <app-chart-card title="Visitas por zona" unit="Sin las cajas, por donde pasan todos">
      <app-bar-chart [rows]="visitRows()" />
      <app-data-table chartTable [columns]="['Zona', 'Visitas']" [rows]="visitTable()" />
    </app-chart-card>

    <app-chart-card title="Permanencia media por zona" unit="Minutos por visita">
      <app-bar-chart [rows]="stayRows()" />
      <app-data-table chartTable [columns]="['Zona', 'Permanencia']" [rows]="stayTable()" />
    </app-chart-card>
  </div>

  @if (data().weekGrid) {
    <app-chart-card
      title="Afluencia por día y hora"
      unit="Media de personas que entran cada hora"
    >
      <app-heat-grid [rows]="gridRows()" [columns]="shortHours" unit="personas/hora" />
      <app-data-table chartTable [columns]="gridColumns" [rows]="gridTable()" />
    </app-chart-card>
  }
</div>
</div>
