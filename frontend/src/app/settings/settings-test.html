<div class="grid items-start gap-6 px-6 py-6 md:px-8 xl:grid-cols-[minmax(0,1fr)_20rem]">
  <section class="rounded-2xl border border-line bg-surface p-4">
    @if (videoUrl(); as url) {
      <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
        <h2 class="min-w-0 truncate font-semibold">{{ fileName() }}</h2>
        <label
          class="flex cursor-pointer items-center gap-2 rounded-lg border border-line px-3 py-1.5 text-sm font-medium hover:bg-sunken focus-within:outline-2 focus-within:outline-accent"
        >
          <app-icon name="upload" class="size-4" />
          Cambiar vídeo
          <input type="file" accept="video/*" class="sr-only" (change)="pick($event)" />
        </label>
      </div>

      <app-video-heatmap
        [src]="url"
        [showCamera]="showCamera()"
        [radius]="radius()"
        [confidence]="confidence()"
        [decay]="decay()"
      />

      <div class="mt-3 flex flex-wrap items-center gap-x-3 gap-y-2 text-xs text-ink-2">
        <span>Menos presencia</span>
        <span class="h-2 w-40 rounded-full" [style.background]="heatGradient"></span>
        <span>Más presencia</span>
        <span class="ml-auto flex items-center gap-1.5">
          <app-icon name="info" class="size-4" />
          Vista previa local: el calor sale del movimiento, aún no del modelo
        </span>
      </div>
    } @else {
      <label
        class="flex aspect-video cursor-pointer flex-col items-center justify-center gap-4 rounded-xl border-2 border-dashed px-6 text-center transition-colors focus-within:outline-2 focus-within:outline-accent"
        [class]="dragging() ? 'border-accent bg-sunken' : 'border-line hover:border-ink-3'"
        (dragover)="hover($event, true)"
        (dragleave)="hover($event, false)"
        (drop)="drop($event)"
      >
        <app-icon name="upload" class="size-10 text-accent" />
        <span class="text-lg font-semibold">Sube un vídeo de la tienda</span>
        <span class="rounded-lg bg-accent px-4 py-2 font-semibold text-on-accent">
          Elegir archivo
        </span>
        <span class="text-sm text-ink-2">o arrástralo aquí</span>
        <input type="file" accept="video/*" class="sr-only" (change)="pick($event)" />
      </label>
    }

    @if (error(); as message) {
      <p role="alert" class="mt-3 flex items-center gap-2 text-sm">
        <app-icon name="alert" class="size-5 text-brand-red" />
        {{ message }}
      </p>
    }
  </section>

  <section class="rounded-2xl border border-line bg-surface p-5">
    <h2 class="font-semibold">Opciones</h2>

    <label class="mt-4 flex cursor-pointer items-center gap-3 text-sm font-medium">
      <input
        type="checkbox"
        class="size-4"
        [checked]="showCamera()"
        (change)="showCamera.set(checkedFrom($event))"
      />
      Mostrar cámara
    </label>

    <div class="mt-6 space-y-6 border-t border-line pt-5">
      <label class="block">
        <span class="flex items-baseline justify-between text-sm">
          <span class="font-medium">Radio</span>
          <span class="tabular-nums text-ink-2">{{ radius() }} px</span>
        </span>
        <input
          type="range"
          class="mt-2 w-full"
          min="11"
          max="101"
          step="2"
          [value]="radius()"
          (input)="radius.set(numberFrom($event))"
        />
        <span class="mt-1 block text-xs text-ink-2">Tamaño de la mancha de cada persona</span>
      </label>

      <label class="block">
        <span class="flex items-baseline justify-between text-sm">
          <span class="font-medium">Confianza</span>
          <span class="tabular-nums text-ink-2">{{ confidence().toFixed(2) }}</span>
        </span>
        <input
          type="range"
          class="mt-2 w-full"
          min="0.1"
          max="0.9"
          step="0.05"
          [value]="confidence()"
          (input)="confidence.set(numberFrom($event))"
        />
        <span class="mt-1 block text-xs text-ink-2">Certeza mínima para contar una detección</span>
      </label>

      <label class="block">
        <span class="flex items-baseline justify-between text-sm">
          <span class="font-medium">Decaimiento</span>
          <span class="tabular-nums text-ink-2">{{ decay().toFixed(2) }}</span>
        </span>
        <input
          type="range"
          class="mt-2 w-full"
          min="0"
          max="0.99"
          step="0.01"
          [value]="decay()"
          (input)="decay.set(numberFrom($event))"
        />
        <span class="mt-1 block text-xs text-ink-2">
          Calor que se conserva de un fotograma al siguiente
        </span>
      </label>
    </div>
  </section>
</div>
