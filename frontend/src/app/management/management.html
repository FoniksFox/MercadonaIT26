<div class="mx-auto max-w-7xl px-6 py-8 md:px-8 md:py-10">
<app-page-header title="Gestión" />

<div class="mt-8 space-y-6">
  <div class="grid gap-4 sm:grid-cols-3">
    <app-stat-tile label="Personal en turno" icon="staff" [value]="'' + staffing().onShift" />
    <app-stat-tile label="Zonas con falta de personal" icon="alert" [value]="'' + shortZones()" />
    <app-stat-tile
      label="Cajas abiertas"
      icon="checkout"
      [value]="staffing().openTills + ' de ' + staffing().totalTills"
    />
  </div>

  <section class="rounded-2xl border border-line bg-surface shadow-sm p-5">
    <h2 class="font-semibold">Personal por zona</h2>
    <div class="mt-3 overflow-x-auto">
      <table class="w-full min-w-[40rem] text-sm">
        <thead>
          <tr class="border-b border-line text-left text-ink-2">
            <th scope="col" class="px-2 py-2 font-medium">Zona</th>
            <th scope="col" class="px-2 py-2 text-right font-medium">Clientes ahora</th>
            <th scope="col" class="px-2 py-2 text-right font-medium">Personal</th>
            <th scope="col" class="px-2 py-2 pl-8 font-medium">Estado</th>
            <th scope="col" class="px-2 py-2 font-medium">Acción sugerida</th>
          </tr>
        </thead>
        <tbody>
          @for (row of rows(); track row.zone.id) {
            <tr class="border-b border-line last:border-0">
              <th scope="row" class="px-2 py-3 text-left font-normal">
                <span class="flex items-center gap-3">
                  <app-icon [name]="row.zone.icon" class="size-5 text-ink-3" />
                  {{ row.zone.name }}
                </span>
              </th>
              <td class="px-2 py-3 text-right tabular-nums">{{ row.people }}</td>
              <td class="px-2 py-3 text-right tabular-nums">{{ row.staff }}</td>
              <td class="px-2 py-3 pl-8">
                <span class="flex items-center gap-2">
                  <app-icon [name]="row.status.icon" class="size-5" [class]="row.status.color" />
                  <span [class.font-semibold]="row.coverage === 'short'">{{ row.status.label }}</span>
                </span>
              </td>
              <td class="px-2 py-3" [class.text-ink-3]="!row.action">{{ row.action ?? '–' }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </section>
</div>
</div>
