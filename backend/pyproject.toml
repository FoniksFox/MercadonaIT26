[project]
name = "mercaflow-backend"
version = "0.1.0"
description = "MercaFlow vision backend: person detection, tracking, heatmap and vector field extraction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "numpy>=2.0",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

# CPU-only torch wheels to keep installs light (see AGENTS.md).
# Switch to the default PyPI index if you later need CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
